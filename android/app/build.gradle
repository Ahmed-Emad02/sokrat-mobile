import com.android.build.api.instrumentation.AsmClassVisitorFactory
import com.android.build.api.instrumentation.ClassContext
import com.android.build.api.instrumentation.ClassData
import com.android.build.api.instrumentation.InstrumentationParameters
import com.android.build.api.instrumentation.InstrumentationScope
import com.android.build.api.variant.ApplicationAndroidComponentsExtension
import org.gradle.api.GradleException
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    // Empty list ensures Gradle ALWAYS bundles the JS bundle and assets into the APK,
    // making debug and release APK builds 100% standalone out of the box.
    debuggableVariants = []
    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Employee builds opt in explicitly; normal test builds keep the existing
// signer so installing a test update never requires wiping a saved account.
def productionRelease = providers.gradleProperty("productionRelease").orNull == "true"
def releaseValues = ["SOKRAT_RELEASE_STORE_FILE", "SOKRAT_RELEASE_STORE_PASSWORD",
                     "SOKRAT_RELEASE_KEY_ALIAS", "SOKRAT_RELEASE_KEY_PASSWORD",
                     "SOKRAT_ANDROID_VERSION_CODE", "SOKRAT_ANDROID_VERSION_NAME"]
        .collectEntries { name -> [(name): System.getenv(name)] }
if (productionRelease) {
    def missing = releaseValues.findAll { name, value -> !value?.trim() }.keySet()
    if (!missing.isEmpty()) {
        throw new GradleException("Production signing configuration required: " + missing.join(", "))
    }
    if (!file(releaseValues.SOKRAT_RELEASE_STORE_FILE).isFile()) {
        throw new GradleException("Production keystore file is unavailable")
    }
    if (!(releaseValues.SOKRAT_ANDROID_VERSION_CODE ==~ /[1-9][0-9]{0,8}/)) {
        throw new GradleException("Production version code must be a positive integer")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sokratmobile"
    defaultConfig {
        applicationId "com.sokratmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode productionRelease ? releaseValues.SOKRAT_ANDROID_VERSION_CODE.toInteger() : 110
        versionName productionRelease ? releaseValues.SOKRAT_ANDROID_VERSION_NAME : "1.3.4-direct-sip.13"
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
    signingConfigs {
        if (productionRelease) {
            production {
                storeFile file(releaseValues.SOKRAT_RELEASE_STORE_FILE)
                storePassword releaseValues.SOKRAT_RELEASE_STORE_PASSWORD
                keyAlias releaseValues.SOKRAT_RELEASE_KEY_ALIAS
                keyPassword releaseValues.SOKRAT_RELEASE_KEY_PASSWORD
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // -PproductionRelease=true refuses missing signing credentials;
            // there is no fallback to the debug key for employee releases.
            signingConfig productionRelease ? signingConfigs.production : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        // Diagnostic-only variant for the downlink PCM capture. It mirrors
        // release (same signer, bundled JS, no debuggable flag) so it can
        // update an installed release build in place, and it is the only
        // variant that compiles src/audioDiagnostic and runs the WebRTC
        // playout instrumentation below. Never distribute this variant.
        audioDiagnostic {
            initWith release
            matchingFallbacks = ["release"]
            debuggable = false
            signingConfig productionRelease ? signingConfigs.production : signingConfigs.debug
        }
    }
    // AGP 9 only creates the debug host-test component by default. Compile the
    // diagnostic Java there for JVM tests without enabling dependency release tests.
    sourceSets {
        testDebug {
            java.srcDirs += ["src/audioDiagnostic/java", "src/testAudioDiagnostic/java"]
        }
    }
}


dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // The native receiver policy compiles against this exact SDK interface.
    implementation("org.jitsi:webrtc") {
        version { strictly("124.0.0") }
    }
    // Repackaged com.wireguard.android:tunnel 1.0.20260102. Upstream native
    // libs hardcode /data/data/com.wireguard.android for the UAPI socket, so
    // the native UAPI path is repacked for this app package's data directory.
    implementation(files("libs/tunnel-sokrat.aar"))
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation("com.google.firebase:firebase-messaging")
    implementation("androidx.core:core-ktx:1.13.1")
    testImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Firebase (RNFirebase): must be applied AFTER the Android plugin.
apply plugin: "com.google.gms.google-services"
// libwebrtc.jar is an external dependency artifact, so the hook has to be
// registered with InstrumentationScope.ALL (project + dependency classes).
// AGP applies it to the AAR's embedded jars as well.
// A native interface call must never silently follow an AAR/header upgrade.
// Pin both the resolved binary and the unmodified official header closure.
def netEqSources = new groovy.json.JsonSlurper().parse(file("src/main/cpp/vendor/sources.json"))
def sha256 = { File source ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    source.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}
def androidComponents = project.extensions.getByType(ApplicationAndroidComponentsExtension)
androidComponents.onVariants(androidComponents.selector().all(), { variant ->
    def variantSuffix = variant.name.capitalize()
    def verifyNativeSdk = tasks.register("verifyNetEqSdk${variantSuffix}") {
        inputs.file("src/main/cpp/vendor/sources.json")
        inputs.files(fileTree("src/main/cpp/vendor") { exclude "sources.json" })
        doLast {
            def artifacts = configurations.getByName("${variant.name}RuntimeClasspath")
                    .incoming.artifactView { view ->
                        view.componentFilter { component ->
                            component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                                    component.group == "org.jitsi" && component.module == "webrtc" &&
                                    component.version == "124.0.0"
                        }
                        view.attributes {
                            attribute(org.gradle.api.artifacts.type.ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, "aar")
                        }
                    }.files.files
            if (artifacts.size() != 1 ||
                    sha256(artifacts.first()) != netEqSources.aar.sha256) {
                throw new GradleException("NetEq SDK binary differs from the pinned 124.0.0 AAR")
            }
            netEqSources.files.each { path, expected ->
                def header = file("src/main/cpp/vendor/${path}")
                if (!header.isFile() || sha256(header) != expected) {
                    throw new GradleException("NetEq SDK header integrity failed: ${path}")
                }
            }
        }
    }
    tasks.configureEach { task ->
        if (task.name == "pre${variantSuffix}Build") {
            task.dependsOn(verifyNativeSdk)
        }
    }
    variant.instrumentation.transformClassesWith(
            SokratNetEqReceiverFactory,
            InstrumentationScope.ALL,
            { params -> } as kotlin.jvm.functions.Function1)
} as org.gradle.api.Action)

androidComponents.onVariants(
        androidComponents.selector().withBuildType("audioDiagnostic"),
        { variant ->
            variant.instrumentation.transformClassesWith(
                    SokratPlayoutCallSiteFactory,
                    InstrumentationScope.ALL,
                    { params -> } as kotlin.jvm.functions.Function1
            )
        } as org.gradle.api.Action)

abstract class SokratPlayoutCallSiteFactory
        implements AsmClassVisitorFactory<InstrumentationParameters.None> {

    @Override
    ClassVisitor createClassVisitor(ClassContext classContext, ClassVisitor nextClassVisitor) {
        if (classContext.currentClassData.className != SokratPlayoutCallSiteClassVisitor.TARGET_CLASS) {
            return nextClassVisitor
        }
        return new SokratPlayoutCallSiteClassVisitor(instrumentationContext.apiVersion.get(), nextClassVisitor)
    }

    @Override
    boolean isInstrumentable(ClassData classData) {
        return classData.className == SokratPlayoutCallSiteClassVisitor.TARGET_CLASS
    }
}

class SokratPlayoutCallSiteClassVisitor extends ClassVisitor {

    static final String TARGET_CLASS = 'org.webrtc.audio.WebRtcAudioTrack$AudioTrackThread'
    static final String TARGET_METHOD = 'run'
    static final String TARGET_METHOD_DESCRIPTOR = '()V'
    static final String AUDIO_TRACK_OWNER = 'android/media/AudioTrack'
    static final String AUDIO_TRACK_WRITE = 'write'
    static final String AUDIO_TRACK_WRITE_DESCRIPTOR = '(Ljava/nio/ByteBuffer;II)I'
    static final String HOOK_OWNER = 'com/sokratmobile/diagnostics/PlayoutCapture'
    // The static hook receives the original receiver as its first argument, so
    // the stack (track, buffer, size, mode) is exactly the call's stack.
    static final String HOOK_WRITE_DESCRIPTOR = '(Landroid/media/AudioTrack;Ljava/nio/ByteBuffer;II)I'

    boolean hookInstalled = false
    boolean targetMethodVisited = false
    String unexpectedWrite = null

    SokratPlayoutCallSiteClassVisitor(int api, ClassVisitor nextClassVisitor) {
        super(api, nextClassVisitor)
    }

    @Override
    MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
        MethodVisitor next = super.visitMethod(access, name, descriptor, signature, exceptions)
        if (next == null || name != TARGET_METHOD || descriptor != TARGET_METHOD_DESCRIPTOR) {
            return next
        }
        targetMethodVisited = true
        return new SokratPlayoutCallSiteMethodVisitor(api, next, this)
    }

    void markHookInstalled() {
        hookInstalled = true
    }

    void noteUnexpectedWrite(String description) {
        if (unexpectedWrite == null) {
            unexpectedWrite = description
        }
    }

    @Override
    void visitEnd() {
        if (!hookInstalled) {
            def reason
            if (!targetMethodVisited) {
                reason = 'the class no longer declares ' + TARGET_METHOD + TARGET_METHOD_DESCRIPTOR
            } else if (unexpectedWrite != null) {
                reason = 'the AudioTrack.write call has an unexpected shape (' + unexpectedWrite + ')'
            } else {
                reason = TARGET_METHOD + TARGET_METHOD_DESCRIPTOR + ' no longer calls AudioTrack.write(...)'
            }
            throw new GradleException(
                    'audioDiagnostic instrumentation failed: ' + TARGET_CLASS +
                            ' was instrumented but ' + reason + '. ' +
                            'This WebRTC build is not the one this diagnostic was written for; ' +
                            'refusing to produce an APK whose playout capture would silently record nothing. ' +
                            'Update android/app/build.gradle for the new WebRTC bytecode.')
        }
        super.visitEnd()
    }
}

class SokratPlayoutCallSiteMethodVisitor extends MethodVisitor {

    private final SokratPlayoutCallSiteClassVisitor classVisitor

    SokratPlayoutCallSiteMethodVisitor(int api, MethodVisitor next, SokratPlayoutCallSiteClassVisitor classVisitor) {
        super(api, next)
        this.classVisitor = classVisitor
    }

    @Override
    void visitMethodInsn(int opcode, String owner, String name, String descriptor, boolean isInterface) {
        if (owner == SokratPlayoutCallSiteClassVisitor.AUDIO_TRACK_OWNER &&
                name == SokratPlayoutCallSiteClassVisitor.AUDIO_TRACK_WRITE) {
            if (opcode == Opcodes.INVOKEVIRTUAL &&
                    !isInterface &&
                    descriptor == SokratPlayoutCallSiteClassVisitor.AUDIO_TRACK_WRITE_DESCRIPTOR) {
                super.visitMethodInsn(
                        Opcodes.INVOKESTATIC,
                        SokratPlayoutCallSiteClassVisitor.HOOK_OWNER,
                        SokratPlayoutCallSiteClassVisitor.AUDIO_TRACK_WRITE,
                        SokratPlayoutCallSiteClassVisitor.HOOK_WRITE_DESCRIPTOR,
                        false)
                classVisitor.markHookInstalled()
                return
            }
            classVisitor.noteUnexpectedWrite('opcode=' + opcode + ', descriptor=' + descriptor)
        }
        super.visitMethodInsn(opcode, owner, name, descriptor, isInterface)
    }
}

abstract class SokratNetEqReceiverFactory
        implements AsmClassVisitorFactory<InstrumentationParameters.None> {
    @Override
    boolean isInstrumentable(ClassData data) {
        return data.className == "org.webrtc.RtpReceiver"
    }

    @Override
    ClassVisitor createClassVisitor(ClassContext context, ClassVisitor next) {
        return new SokratNetEqReceiverVisitor(instrumentationContext.apiVersion.get(), next)
    }
}

class SokratNetEqReceiverVisitor extends ClassVisitor {
    boolean hookInstalled = false

    SokratNetEqReceiverVisitor(int api, ClassVisitor next) {
        super(api, next)
    }

    @Override
    MethodVisitor visitMethod(int access, String name, String descriptor,
                              String signature, String[] exceptions) {
        MethodVisitor next = super.visitMethod(access, name, descriptor, signature, exceptions)
        if (next == null || name != "<init>" || descriptor != "(J)V") {
            return next
        }
        def owner = this
        return new MethodVisitor(api, next) {
            @Override
            void visitInsn(int opcode) {
                if (opcode == Opcodes.RETURN) {
                    super.visitVarInsn(Opcodes.ALOAD, 0)
                    super.visitMethodInsn(Opcodes.INVOKESTATIC, "org/webrtc/SokratNetEq",
                            "configure", "(Lorg/webrtc/RtpReceiver;)V", false)
                    owner.hookInstalled = true
                }
                super.visitInsn(opcode)
            }
        }
    }

    @Override
    void visitEnd() {
        if (!hookInstalled) {
            throw new GradleException("NetEq receiver constructor hook not installed; refusing APK")
        }
        super.visitEnd()
    }
}
